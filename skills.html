<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skills</title>
<style>
    html, body{
        height:100%;
        margin:0;
        overflow:hidden;
        font-family:Cambria, serif;
        background:#0b1730;
    }
    .page{
        display:flex;
        flex-direction:column;
        height:100vh;
    }
    .layout{
        width:100%;
        height:calc(100vh - 60px);
        border-collapse:collapse;
    }
    .left-bg{
        width:22%;
        background:#071b34;
        color:white;
        vertical-align:top;
        padding-top:130px;
        box-sizing:border-box;
    }
    .nav-link{
        display:block;
        text-decoration:none;
        color:white;
        font-size:20px;
        font-weight:bold;
        margin:26px auto;
        width:80%;
        padding-bottom:6px;
        border-bottom:2px solid #5aa9ff;
        text-align:center;
    }
    .nav-link:hover{ color:#5aa9ff; }
    .right-bg{
        width:78%;
        background:#c7dcf6;
        padding:18px 24px 0;
        box-sizing:border-box;
    }
    .top-strip{
        height:65px;
        background:#041b3b;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-bottom:10px;
    }
    .header-name{
        color:white;
        font-size:36px;
        font-weight:bold;
        letter-spacing:3px;
    }
    .box{
        border:6px solid #7589a9;
        background:#cfe1ff;
        height:calc(100% - 100px);
        overflow:hidden;
        padding:18px 26px 14px;
        box-sizing:border-box;
    }
    .box-title{
        font-size:44px;
        font-weight:bold;
        color:#005989;
        letter-spacing:3px;
        margin-bottom:5px;
    }
    .line{
        height:2px;
        background:#9eb6d9;
        margin-bottom:16px;
    }
    .skill-row{ margin-bottom:12px; }
    .skill-name{
        font-size:20px;
        font-weight:bold;
        color:#004c89;
        margin-bottom:4px;
    }
    .bar-container{
        width:65%;
        height:20px;
        background:#f2e8ed;
        border:2px solid #c49d9d;
        border-radius:12px;
        overflow:hidden;
        display:inline-block;
    }
    .bar-fill{
        height:100%;
        background:linear-gradient(90deg,#6f1307,#c34d33);
    }
    .percent{
        font-size:18px;
        color:#99290a;
        font-weight:bold;
        margin-left:6px;
    }
    .html{ width:75%; }
    .css{ width:70%; }
    .cprog{ width:60%; }
    .js{ width:45%; }
    .english{ width:80%; }
    .contact-row{
        height:60px;
        background:#b9cff4;
        border-top:4px solid #4f5f7f;
        display:flex;
        justify-content:center;
        align-items:center;
        font-size:20px;
        color:#143047;
    }
    .contact-inner{
        display:flex;
        align-items:center;
        gap:10px;
    }
    .circle-icon{
        width:32px;
        height:32px;
        background:#25D366;
        border-radius:50%;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        font-size:18px;
    }
    .square-icon{
        width:32px;
        height:32px;
        background:#1f2937;
        border-radius:6px;
        display:flex;
        justify-content:center;
        align-items:center;
        color:white;
        font-size:18px;
    }
    .contact-label{ font-weight:bold; }
    .contact-link{ text-decoration:underline; color:#004aad; }
    .divider{ margin:0 12px; color:#4f5f7f; font-weight:bold; }
</style>
</head>
<body>
<div class="page">
<table class="layout">
<tr>
<td class="left-bg">
    <a href="about.html" class="nav-link">ABOUT</a>
    <a href="qualification.html" class="nav-link">QUALIFICATION</a>
    <a href="skills.html" class="nav-link">SKILLS</a>
    <a href="projects.html" class="nav-link">PROJECTS</a>
</td>
<td class="right-bg">
    <div class="top-strip">
        <div class="header-name">GAUTAM KUMAR DUTTA</div>
    </div>
    <div class="box">
        <div class="box-title">SKILLS</div>
        <div class="line"></div>
        <div class="skill-row">
            <div class="skill-name">Python</div>
            <div class="bar-container"><div class="bar-fill html"></div></div>
            <span class="percent">80%</span>
        </div>
        <div class="skill-row">
            <div class="skill-name">HTML</div>
            <div class="bar-container"><div class="bar-fill html"></div></div>
            <span class="percent">75%</span>
        </div>
        <div class="skill-row">
            <div class="skill-name">CSS</div>
            <div class="bar-container"><div class="bar-fill css"></div></div>
            <span class="percent">70%</span>
        </div>
        <div class="skill-row">
            <div class="skill-name">C Programming</div>
            <div class="bar-container"><div class="bar-fill cprog"></div></div>
            <span class="percent">60%</span>
        </div>
        <div class="skill-row">
            <div class="skill-name">English (Fluent)</div>
            <div class="bar-container"><div class="bar-fill english"></div></div>
            <span class="percent">70%</span>
        </div>
    </div>
</td>
</tr>
</table>
<div class="contact-row">
    <div class="contact-inner">
        <span class="circle-icon">&#128222;</span>
        <span class="contact-label">Contact:</span>
        <a href="tel:9234834499" class="contact-link">9234834499</a>
        <span class="divider">|</span>
        <span class="square-icon">&#9993;</span>
        <span class="contact-label">Email:</span>
        <a href="mailto:duttagautam39@gmail.com" class="contact-link">duttagautam39@gmail.com</a>
    </div>
</div>
</div>
</body>
</html>
